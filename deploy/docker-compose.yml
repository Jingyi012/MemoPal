services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memopal
      POSTGRES_USER: memopal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - memopal_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memopal -d memopal"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/${IMAGE_OWNER}/memopal-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=memopal;Username=memopal;Password=${POSTGRES_PASSWORD}
      FileStorage__RootPath: /data/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    volumes:
      - memopal_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  admin:
    image: ghcr.io/${IMAGE_OWNER}/memopal-admin:${ADMIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-18081}:80"

volumes:
  memopal_db:
  memopal_uploads:
    external: true
    name: ${UPLOADS_VOLUME_NAME:-memopal_uploads}
