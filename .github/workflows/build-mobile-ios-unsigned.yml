name: Build MemoPal iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version, for example 1.0.0
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ios-unsigned
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    environment: uat
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      MEMOPAL_APP_VERSION: ${{ inputs.version }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.MEMOPAL_MOBILE_API_BASE_URL }}
      EXPO_PUBLIC_MEDIA_BASE_URL: ${{ secrets.MEMOPAL_MOBILE_MEDIA_BASE_URL }}
      EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.MEMOPAL_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${{ secrets.MEMOPAL_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID: ${{ secrets.MEMOPAL_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_HOSTED_DOMAIN: ${{ secrets.MEMOPAL_GOOGLE_HOSTED_DOMAIN }}
      EXPO_PUBLIC_LOCAL_DEV_MODE: false
      EXPO_PUBLIC_STRICT_BASE_URL: true
      EXPO_PUBLIC_BUILD_ENV: uat
      COCOAPODS_DISABLE_STATS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          node --version
          npm --version
          pod --version

      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${MEMOPAL_APP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use semantic version format, for example 1.0.0"
            exit 1
          fi
          test -n "${EXPO_PUBLIC_API_BASE_URL}" || { echo "MEMOPAL_MOBILE_API_BASE_URL is required"; exit 1; }
          test -n "${EXPO_PUBLIC_MEDIA_BASE_URL}" || { echo "MEMOPAL_MOBILE_MEDIA_BASE_URL is required"; exit 1; }
          test -n "${EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID}" || { echo "MEMOPAL_GOOGLE_WEB_CLIENT_ID is required"; exit 1; }

      - name: Install JavaScript dependencies
        working-directory: .
        run: npm ci

      - name: Check mobile app
        working-directory: .
        run: npm run check:mobile

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Archive without Apple signing
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' ! -name 'Pods.xcworkspace' -print -quit)"
          if [[ -z "${workspace}" ]]; then
            echo "Could not find the generated iOS workspace"
            exit 1
          fi

          scheme="$(basename "${workspace}" .xcworkspace)"
          archive_path="${RUNNER_TEMP}/MemoPal.xcarchive"
          log_path="${RUNNER_TEMP}/memopal-xcodebuild.log"

          echo "Workspace: ${workspace}"
          echo "Scheme: ${scheme}"
          xcodebuild -workspace "${workspace}" -list

          xcodebuild \
            -workspace "${workspace}" \
            -scheme "${scheme}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${archive_path}" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' 2>&1 | tee "${log_path}"

          app_path="${archive_path}/Products/Applications/${scheme}.app"
          if [[ ! -d "${app_path}" ]]; then
            echo "The unsigned iOS app was not produced at ${app_path}"
            exit 1
          fi

          artifact_root="${GITHUB_WORKSPACE}/artifacts/ios"
          payload_path="${artifact_root}/Payload"
          ipa_path="${artifact_root}/MemoPal-${MEMOPAL_APP_VERSION}-unsigned.ipa"
          rm -rf "${artifact_root}"
          mkdir -p "${payload_path}"
          cp -R "${app_path}" "${payload_path}/${scheme}.app"

          (cd "${artifact_root}" && zip -qry "${ipa_path}" Payload)
          echo "IPA_PATH=${ipa_path}" >> "${GITHUB_ENV}"
          echo "Created ${ipa_path}"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: memopal-ios-unsigned-${{ inputs.version }}
          path: artifacts/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memopal-ios-build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/memopal-xcodebuild.log
            ${{ runner.temp }}/MemoPal.xcarchive/Logs/**/*.log
          if-no-files-found: ignore
