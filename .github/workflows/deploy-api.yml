name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "deploy/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        type: choice
        options:
          - uat
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MemoPal.slnx

      - name: Build
        run: dotnet build MemoPal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MemoPal.slnx --configuration Release --no-build --no-restore

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH is required. Set it in GitHub Environment variables."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image owner (lowercase)
        run: |
          RESOLVED_IMAGE_OWNER="${IMAGE_OWNER:-${{ github.repository_owner }}}"
          RESOLVED_IMAGE_OWNER="$(echo "${RESOLVED_IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "RESOLVED_IMAGE_OWNER=${RESOLVED_IMAGE_OWNER}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.RESOLVED_IMAGE_OWNER }}/memopal-backend:latest
            ghcr.io/${{ env.RESOLVED_IMAGE_OWNER }}/memopal-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Missing one or more required VPS secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
            exit 1
          fi
          if ! [[ "${VPS_PORT}" =~ ^[0-9]+$ ]] || [ "${VPS_PORT}" -lt 1 ] || [ "${VPS_PORT}" -gt 65535 ]; then
            echo "VPS_PORT must be a valid TCP port (default: 22)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keyscan -T 10 -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            echo "ssh-keyscan failed for host=${VPS_HOST} port=${VPS_PORT}"
            cat /tmp/ssh-keyscan.err || true
            exit 1
          fi

      - name: Upload deploy manifests
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p ${DEPLOY_PATH}/deploy/nginx"
          scp -P "${VPS_PORT}" ./deploy/docker-compose.yml \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/docker-compose.yml"
          scp -P "${VPS_PORT}" ./deploy/nginx/default.conf \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/deploy/nginx/default.conf"
          scp -P "${VPS_PORT}" ./deploy/.env.example \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.env.example"

      - name: Deploy backend API
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${RESOLVED_IMAGE_OWNER}" <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="$1"
          IMAGE_OWNER="$2"
          cd "${DEPLOY_PATH}"

          test -f ./.env || { echo "Missing ${DEPLOY_PATH}/.env. Copy from .env.example and fill values."; exit 1; }
          sed -i 's/\r$//' ./.env
          set -a; . ./.env; set +a
          for required_name in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DATA_PATH MEMOPAL_UPLOADS_PATH Database__ApplyMigrationsOnStartup ASPNETCORE_ENVIRONMENT ASPNETCORE_URLS FileStorage__RootPath API_BIND_HOST API_HOST_PORT DB_BIND_HOST DB_HOST_PORT ADMIN_BIND_HOST ADMIN_HOST_PORT; do
            if [ -z "${!required_name:-}" ]; then
              echo "${required_name} is required in ${DEPLOY_PATH}/.env"
              exit 1
            fi
          done
          case "${POSTGRES_DATA_PATH}" in /*) ;; *) echo "POSTGRES_DATA_PATH must be absolute"; exit 1 ;; esac
          case "${MEMOPAL_UPLOADS_PATH}" in /*) ;; *) echo "MEMOPAL_UPLOADS_PATH must be absolute"; exit 1 ;; esac
          mkdir -p "${POSTGRES_DATA_PATH}" "${MEMOPAL_UPLOADS_PATH}"

          IMAGE_OWNER="${IMAGE_OWNER}" BACKEND_IMAGE_TAG=latest docker compose pull db api
          IMAGE_OWNER="${IMAGE_OWNER}" BACKEND_IMAGE_TAG=latest docker compose up -d db api

          api_container_id="$(docker compose ps -q api)"
          if [ -z "${api_container_id}" ]; then
            echo "API container was not created."
            docker compose ps -a || true
            exit 1
          fi

          api_status="$(docker inspect -f '{{.State.Status}}' "${api_container_id}" 2>/dev/null || echo unknown)"
          if [ "${api_status}" != "running" ]; then
            echo "API container is not running. status=${api_status}"
            docker compose ps -a || true
            docker compose logs api --tail 200 || true
            exit 1
          fi

          docker compose ps
          EOF
