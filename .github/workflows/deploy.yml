name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        type: choice
        options:
          - uat
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH is required. Set it in GitHub Environment variables."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image owner (lowercase)
        run: |
          RESOLVED_IMAGE_OWNER="${IMAGE_OWNER:-${{ github.repository_owner }}}"
          RESOLVED_IMAGE_OWNER="$(echo "${RESOLVED_IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "RESOLVED_IMAGE_OWNER=${RESOLVED_IMAGE_OWNER}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.RESOLVED_IMAGE_OWNER }}/memopal-backend:latest
            ghcr.io/${{ env.RESOLVED_IMAGE_OWNER }}/memopal-backend:${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build EF migration bundle
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet restore src/MemoPal.Api/MemoPal.Api.csproj
          dotnet ef migrations bundle \
            --project src/MemoPal.Infrastructure \
            --startup-project src/MemoPal.Api \
            --configuration Release \
            --self-contained \
            -r linux-x64 \
            -o efbundle

      - name: Configure SSH
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_PORT }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Missing one or more required VPS secrets: VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keyscan -T 10 -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            echo "ssh-keyscan failed for host=${{ secrets.VPS_HOST }} port=${{ secrets.VPS_PORT }}"
            cat /tmp/ssh-keyscan.err || true
            exit 1
          fi

      - name: Upload deploy manifests
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ${DEPLOY_PATH}/deploy/nginx ${DEPLOY_PATH}/bin"
          scp -P "${{ secrets.VPS_PORT }}" ./deploy/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}/docker-compose.yml"
          scp -P "${{ secrets.VPS_PORT }}" ./deploy/nginx/default.conf \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}/deploy/nginx/default.conf"
          scp -P "${{ secrets.VPS_PORT }}" ./deploy/.env.example \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}/.env.example"

      - name: Upload migration bundle
        run: |
          scp -P "${{ secrets.VPS_PORT }}" ./efbundle \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}/bin/efbundle"

      - name: Deploy backend and run migrations
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' -- "${DEPLOY_PATH}" "${RESOLVED_IMAGE_OWNER}" "${TARGET_ENV}" <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="$1"
          IMAGE_OWNER="$2"
          TARGET_ENV="$3"
          COMPOSE_PROJECT_NAME="memopal-${TARGET_ENV}"
          cd "${DEPLOY_PATH}"

          test -f ./.env || { echo "Missing ${DEPLOY_PATH}/.env. Copy from .env.example and fill values."; exit 1; }
          test -f ./docker-compose.yml || { echo "Missing ${DEPLOY_PATH}/docker-compose.yml"; exit 1; }
          sed -i 's/\r$//' ./.env
          set -a
          . ./.env
          set +a
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in ${DEPLOY_PATH}/.env}"
          : "${DB_HOST_PORT:?DB_HOST_PORT is required in ${DEPLOY_PATH}/.env}"
          UPLOADS_VOLUME_NAME="${UPLOADS_VOLUME_NAME:-memopal_uploads}"

          compose() {
            IMAGE_OWNER="${IMAGE_OWNER}" BACKEND_IMAGE_TAG=${{ github.sha }} \
            docker compose \
              --project-name "${COMPOSE_PROJECT_NAME}" \
              --env-file ./.env \
              --file ./docker-compose.yml "$@"
          }

          docker volume create "${UPLOADS_VOLUME_NAME}" >/dev/null
          compose config --services | grep -qx 'api' || { echo "Service 'api' not found in compose config"; compose config; exit 1; }
          compose up -d db
          until compose exec -T db pg_isready -U memopal -d memopal >/dev/null 2>&1; do
            sleep 2
          done

          chmod +x ./bin/efbundle
          ./bin/efbundle --connection "Host=127.0.0.1;Port=${DB_HOST_PORT};Database=memopal;Username=memopal;Password=$POSTGRES_PASSWORD"

          migration_count="$(compose exec -T db psql -U memopal -d memopal -Atqc 'SELECT COUNT(*) FROM "__EFMigrationsHistory";' 2>/dev/null || true)"
          if [ -z "${migration_count}" ] || [ "${migration_count}" = "0" ]; then
            echo "EF migration verification failed: __EFMigrationsHistory is empty or unavailable."
            compose exec -T db psql -U memopal -d memopal -c '\dt' || true
            exit 1
          fi

          public_table_count="$(compose exec -T db psql -U memopal -d memopal -Atqc \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';\" 2>/dev/null || true)"
          if [ -z "${public_table_count}" ] || [ "${public_table_count}" = "0" ]; then
            echo "EF migration verification failed: no public tables found after migration."
            compose exec -T db psql -U memopal -d memopal -c '\dt' || true
            exit 1
          fi

          compose pull api
          compose up -d --no-deps --force-recreate api

          api_container_id="$(compose ps -q api)"
          if [ -z "${api_container_id}" ]; then
            echo "API container was not created."
            compose config --services || true
            compose ps -a || true
            exit 1
          fi

          api_status="$(docker inspect -f '{{.State.Status}}' "${api_container_id}" 2>/dev/null || echo unknown)"
          if [ "${api_status}" != "running" ]; then
            echo "API container is not running. status=${api_status}"
            compose ps -a || true
            compose logs api --tail 200 || true
            exit 1
          fi

          compose ps
          EOF
