name: Deploy Admin

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        type: choice
        options:
          - uat
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-admin-${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH is required. Set it in GitHub Environment variables."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ghcr.io/${{ vars.IMAGE_OWNER != '' && vars.IMAGE_OWNER || github.repository_owner }}/memopal-admin:latest
            ghcr.io/${{ vars.IMAGE_OWNER != '' && vars.IMAGE_OWNER || github.repository_owner }}/memopal-admin:${{ github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy admin
        run: |
          RESOLVED_IMAGE_OWNER="${IMAGE_OWNER:-${{ github.repository_owner }}}"
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' -- "${DEPLOY_PATH}" "${RESOLVED_IMAGE_OWNER}" <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="$1"
          IMAGE_OWNER="$2"
          cd "${DEPLOY_PATH}"

          IMAGE_OWNER="${IMAGE_OWNER}" ADMIN_IMAGE_TAG=${{ github.sha }} docker compose pull admin
          IMAGE_OWNER="${IMAGE_OWNER}" ADMIN_IMAGE_TAG=${{ github.sha }} docker compose up -d admin

          docker compose ps
          EOF
