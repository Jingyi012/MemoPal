name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "shared/**"
      - "deploy/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        type: choice
        options:
          - uat
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-admin-${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'uat' }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER || secrets.IMAGE_OWNER }}
      VITE_API_BASE_URL: ${{ vars.MEMOPAL_MOBILE_API_BASE_URL || secrets.MEMOPAL_MOBILE_API_BASE_URL || vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
      VITE_MEDIA_BASE_URL: ${{ vars.MEMOPAL_MOBILE_MEDIA_BASE_URL || secrets.MEMOPAL_MOBILE_MEDIA_BASE_URL || vars.VITE_MEDIA_BASE_URL || secrets.VITE_MEDIA_BASE_URL }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH is required. Set it in GitHub Environment variables."
            exit 1
          fi
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "An admin API URL is required. Set MEMOPAL_MOBILE_API_BASE_URL (or VITE_API_BASE_URL) in the selected GitHub Environment variables or secrets."
            exit 1
          fi
          if [ -z "${VITE_MEDIA_BASE_URL}" ]; then
            echo "An admin media URL is required. Set MEMOPAL_MOBILE_MEDIA_BASE_URL (or VITE_MEDIA_BASE_URL) in the selected GitHub Environment variables or secrets."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image owner (lowercase)
        run: |
          RESOLVED_IMAGE_OWNER="${IMAGE_OWNER:-${{ github.repository_owner }}}"
          RESOLVED_IMAGE_OWNER="$(echo "${RESOLVED_IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "RESOLVED_IMAGE_OWNER=${RESOLVED_IMAGE_OWNER}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_MEDIA_BASE_URL=${{ env.VITE_MEDIA_BASE_URL }}
          tags: |
            ghcr.io/${{ env.RESOLVED_IMAGE_OWNER }}/memopal-admin:latest
            ghcr.io/${{ env.RESOLVED_IMAGE_OWNER }}/memopal-admin:${{ github.sha }}

      - name: Configure SSH
        run: |
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Missing one or more required VPS secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
            exit 1
          fi
          if ! [[ "${VPS_PORT}" =~ ^[0-9]+$ ]] || [ "${VPS_PORT}" -lt 1 ] || [ "${VPS_PORT}" -gt 65535 ]; then
            echo "VPS_PORT must be a valid TCP port (default: 22)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keyscan -T 10 -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            echo "ssh-keyscan failed for host=${VPS_HOST} port=${VPS_PORT}"
            cat /tmp/ssh-keyscan.err || true
            exit 1
          fi

      - name: Deploy admin
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${RESOLVED_IMAGE_OWNER}" <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="$1"
          IMAGE_OWNER="$2"
          cd "${DEPLOY_PATH}"
          test -f ./.env || { echo "Missing ${DEPLOY_PATH}/.env. Copy from .env.example and fill values."; exit 1; }
          sed -i 's/\r$//' ./.env
          set -a; . ./.env; set +a
          for required_name in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DATA_PATH MEMOPAL_UPLOADS_PATH Database__ApplyMigrationsOnStartup ASPNETCORE_ENVIRONMENT ASPNETCORE_URLS FileStorage__RootPath API_BIND_HOST API_HOST_PORT DB_BIND_HOST DB_HOST_PORT ADMIN_BIND_HOST ADMIN_HOST_PORT; do
            if [ -z "${!required_name:-}" ]; then
              echo "${required_name} is required in ${DEPLOY_PATH}/.env"
              exit 1
            fi
          done

          IMAGE_OWNER="${IMAGE_OWNER}" ADMIN_IMAGE_TAG=latest docker compose pull admin
          IMAGE_OWNER="${IMAGE_OWNER}" ADMIN_IMAGE_TAG=latest docker compose up -d admin

          admin_container_id="$(docker compose ps -q admin)"
          if [ -z "${admin_container_id}" ]; then
            echo "Admin container was not created."
            docker compose ps -a || true
            exit 1
          fi

          admin_status="$(docker inspect -f '{{.State.Status}}' "${admin_container_id}" 2>/dev/null || echo unknown)"
          if [ "${admin_status}" != "running" ]; then
            echo "Admin container is not running. status=${admin_status}"
            docker compose ps -a || true
            docker compose logs admin --tail 200 || true
            exit 1
          fi

          docker compose ps
          EOF
